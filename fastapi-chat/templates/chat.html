<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Chat App</title>
    <link href="/static/style.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="header-left">
                <i class="fas fa-comments"></i>
                <h1>FastAPI Chat</h1>
            </div>
            <div class="header-right">
                <span class="online-count">
                    <i class="fas fa-circle online-indicator"></i>
                    <span id="userCount">0</span> online
                </span>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="chat-messages" id="messages">
            <!-- Messages will be inserted here -->
        </div>

        <!-- Message Input Area -->
        <div class="chat-input-container">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
                <button id="sendButton" type="button">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Username Modal -->
    <div id="usernameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-user"></i>
                <h2>Join the Chat</h2>
            </div>
            <div class="modal-body">
                <p>Enter your username to start chatting:</p>
                <input type="text" id="usernameInput" placeholder="Your username" maxlength="20">
                <button id="joinButton" type="button">Join Chat</button>
            </div>
        </div>
    </div>

    <!-- Connection Status -->
    <div id="connectionStatus" class="connection-status">
        <i class="fas fa-wifi"></i>
        <span>Connecting...</span>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
